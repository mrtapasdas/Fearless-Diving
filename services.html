<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Services | FearLess Diving</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-50 antialiased flex flex-col min-h-screen">

    <!-- Fixed Header -->
    <nav class="bg-slate-900/95 backdrop-blur-md fixed w-full top-0 z-50 border-b border-cyan-900 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center cursor-pointer" onclick="window.location.href='index.html'">
                    <i class="fa-solid fa-water text-cyan-400 text-3xl mr-2"></i>
                    <span class="font-bold text-xl tracking-wider">FearLess<span class="text-cyan-400">Diving</span></span>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-6">
                        <a href="index.html" class="hover:text-cyan-400 transition font-medium">Home</a>
                        <a href="about.html" class="hover:text-cyan-400 transition font-medium">About Us</a>
                        <a href="services.html" class="text-cyan-400 font-bold border-b-2 border-cyan-400 px-1 py-5">Services</a>
                        <a href="contact.html" class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2 rounded-full transition">Contact Us</a>
                    </div>
                </div>
                <div class="-mr-2 flex md:hidden">
                    <button onclick="toggleMenu()" class="text-gray-300 hover:text-white p-2">
                        <i class="fa-solid fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="hidden md:hidden bg-slate-900 border-t border-slate-800" id="mobile-nav">
            <div class="px-4 pt-4 pb-6 space-y-2">
                <a href="index.html" class="text-gray-300 block px-3 py-2 rounded-md">Home</a>
                <a href="about.html" class="text-gray-300 block px-3 py-2 rounded-md">About Us</a>
                <a href="services.html" class="text-cyan-400 font-bold block px-3 py-2 rounded-md bg-slate-800">Services</a>
                <a href="contact.html" class="text-gray-300 block px-3 py-2 rounded-md">Contact Us</a>
            </div>
        </div>
    </nav>

    <div class="pt-32 pb-12 text-center px-4">
        <h1 class="text-4xl font-bold text-cyan-400">All Adventures</h1>
        <p class="text-gray-400 mt-2">Choose your next challenge.</p>
    </div>

    <!-- Services List -->
    <div class="max-w-6xl mx-auto px-4 pb-24 grid grid-cols-1 gap-16">

        <!-- Item 1 -->
        <div class="bg-slate-800 rounded-2xl overflow-hidden shadow-2xl border border-slate-700">
            <div class="flex overflow-x-auto snap-x snap-mandatory snap-gallery h-64 md:h-80">
                <img src="https://images.unsplash.com/photo-1544551763-46a8723ba3f9?w=800&q=80" loading="lazy" class="snap-center w-full flex-shrink-0 object-cover">
                <img src="https://images.unsplash.com/photo-1682687981922-7b55dbb30892?w=800&q=80" loading="lazy" class="snap-center w-full flex-shrink-0 object-cover">
            </div>
            <div class="p-6 md:p-8">
                <div class="flex flex-col md:flex-row justify-between items-start mb-4">
                    <h2 class="text-2xl font-bold text-white">Discovery Scuba</h2>
                    <span class="bg-cyan-400 text-slate-900 font-bold px-4 py-1 rounded text-lg mt-2 md:mt-0">$80</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-gray-300 mb-6">
                    <div><span class="font-bold text-cyan-500">Duration:</span> 2 Hours</div>
                    <div><span class="font-bold text-cyan-500">Depth:</span> 12 Meters</div>
                    <div><span class="font-bold text-cyan-500">Includes:</span> Photos & Videos</div>
                </div>
                <button onclick="bookNow('Discovery Scuba', '$80')" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg transition">Book Now via WhatsApp</button>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="bg-slate-800 rounded-2xl overflow-hidden shadow-2xl border border-slate-700">
            <div class="flex overflow-x-auto snap-x snap-mandatory snap-gallery h-64 md:h-80">
                <img src="https://images.unsplash.com/photo-1516815231560-8f41ec531527?w=800&q=80" loading="lazy" class="snap-center w-full flex-shrink-0 object-cover">
            </div>
            <div class="p-6 md:p-8">
                <div class="flex flex-col md:flex-row justify-between items-start mb-4">
                    <h2 class="text-2xl font-bold text-white">PADI Open Water</h2>
                    <span class="bg-cyan-400 text-slate-900 font-bold px-4 py-1 rounded text-lg mt-2 md:mt-0">$350</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-gray-300 mb-6">
                    <div><span class="font-bold text-cyan-500">Duration:</span> 4 Days</div>
                    <div><span class="font-bold text-cyan-500">License:</span> International</div>
                </div>
                <button onclick="bookNow('PADI Open Water', '$350')" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg transition">Book Now via WhatsApp</button>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="bg-slate-950 pt-10 px-4 border-t border-slate-800 mt-auto">
        <div class="bg-black py-4 text-center text-gray-700 text-xs w-full">
            &copy; 2026 FearLess Diving.
        </div>
    </footer>

    <!-- Fixed Icons -->
    <a href="tel:+919876543210" class="fixed bottom-6 left-6 z-50 bg-blue-600 w-14 h-14 rounded-full flex items-center justify-center text-white shadow-lg hover:scale-110 transition">
        <i class="fa-solid fa-phone text-2xl"></i>
    </a>
    <a href="https://wa.me/919876543210" target="_blank" class="fixed bottom-6 right-6 z-50 bg-green-500 w-14 h-14 rounded-full flex items-center justify-center text-white shadow-lg hover:scale-110 transition">
        <i class="fa-brands fa-whatsapp text-3xl"></i>
    </a>
    <script src="script.js"></script>
</body>
</html>
