<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost at Sea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { deep: '#020b16', cyan: '#06b6d4', } } } }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-deep flex items-center justify-center h-screen text-center px-6 overflow-hidden">
    <div class="relative z-10">
        <h1 class="text-9xl font-bold text-cyan opacity-20">404</h1>
        <div class="absolute inset-0 flex items-center justify-center">
             <i class="fa-solid fa-anchor text-6xl text-white animate-bounce"></i>
        </div>
        <h2 class="text-3xl font-bold text-white mt-4">Lost at Sea?</h2>
        <p class="text-gray-400 mt-2 mb-8">It looks like you've drifted too far from the boat.</p>
        <a href="index.html" class="bg-cyan text-deep px-8 py-3 rounded-full font-bold hover:bg-white transition">Return to Surface</a>
    </div>
    
    <!-- Bubbles Animation Effect -->
    <div class="absolute inset-0 z-0 pointer-events-none">
        <div class="absolute bottom-0 left-10 w-4 h-4 bg-white/10 rounded-full animate-float-1"></div>
        <div class="absolute bottom-0 left-1/2 w-6 h-6 bg-white/10 rounded-full animate-float-3"></div>
        <div class="absolute bottom-0 right-20 w-3 h-3 bg-white/10 rounded-full animate-float-2"></div>
    </div>
    
    <script src="assets/js/script.js"></script>
</body>
</html>
