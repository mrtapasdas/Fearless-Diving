<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | FearLess Diving</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ocean: '#0f172a', cyan: '#06b6d4', } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-ocean text-gray-200 no-select">

    <nav class="fixed w-full z-50 bg-ocean/90 backdrop-blur-md border-b border-gray-800">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-bold text-cyan">FearLess<span class="text-white">Diving</span></a>
            <div class="hidden md:flex space-x-8">
                <a href="index.html" class="hover:text-cyan transition">Home</a>
                <a href="about.html" class="hover:text-cyan transition">About Us</a>
                <a href="services.html" class="hover:text-cyan transition">Services</a>
                <a href="contact.html" class="text-cyan font-bold transition">Contact Us</a>
            </div>
            <button id="menu-btn" class="block md:hidden text-2xl focus:outline-none"><i class="fas fa-bars"></i></button>
        </div>
        <div id="menu" class="hidden flex-col items-center bg-ocean md:hidden border-t border-gray-800 py-4 space-y-4">
            <a href="index.html" class="hover:text-cyan">Home</a>
            <a href="about.html" class="hover:text-cyan">About Us</a>
            <a href="services.html" class="hover:text-cyan">Services</a>
            <a href="contact.html" class="text-cyan">Contact Us</a>
        </div>
    </nav>

    <div class="pt-32 pb-10 bg-slate-900 text-center">
        <h1 class="text-4xl font-bold text-white">Contact <span class="text-cyan">Us</span></h1>
    </div>

    <section class="py-16">
        <div class="container mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-12">
            
            <!-- Contact Info & Map -->
            <div>
                <h2 class="text-2xl font-bold mb-6">Get In Touch</h2>
                <div class="space-y-4 mb-8">
                    <p class="flex items-center text-gray-400"><i class="fas fa-phone-alt text-cyan w-8"></i> +91 98765 43210</p>
                    <p class="flex items-center text-gray-400"><i class="fab fa-whatsapp text-cyan w-8"></i> +91 98765 43210</p>
                    <p class="flex items-center text-gray-400"><i class="fas fa-envelope text-cyan w-8"></i> info@fearlessdiving.com</p>
                    <p class="flex items-center text-gray-400"><i class="fas fa-map-marker-alt text-cyan w-8"></i> Beach Road, Havelock Island, Andaman.</p>
                </div>

                <!-- Google Map Embed (Iframe) -->
                <div class="w-full h-64 bg-gray-800 rounded-lg overflow-hidden border border-gray-700">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31307.57522437654!2d92.9866826!3d11.9763789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3088d9047970d4c1%3A0x675841444907997b!2sHavelock%20Island!5e0!3m2!1sen!2sin!4v1600000000000!5m2!1sen!2sin" 
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                    </iframe>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="bg-slate-800 p-8 rounded-lg border border-gray-700 shadow-lg">
                <h2 class="text-2xl font-bold mb-6">Send Message</h2>
                <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Thank you! We will contact you soon.');">
                    <div class="mb-4">
                        <label class="block text-gray-400 text-sm mb-2">Name</label>
                        <input type="text" class="w-full bg-ocean border border-gray-600 rounded p-3 text-white focus:border-cyan focus:outline-none" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-400 text-sm mb-2">Phone</label>
                        <input type="tel" class="w-full bg-ocean border border-gray-600 rounded p-3 text-white focus:border-cyan focus:outline-none" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-400 text-sm mb-2">Message</label>
                        <textarea class="w-full bg-ocean border border-gray-600 rounded p-3 text-white focus:border-cyan focus:outline-none h-32" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-cyan text-ocean font-bold py-3 rounded hover:bg-white transition">
                        Submit
                    </button>
                </form>
            </div>

        </div>
    </section>

    <!-- FOOTER (Simplified) -->
    <footer class="bg-ocean border-t border-gray-800 pt-10 pb-24 text-center">
        <p class="text-gray-500 text-sm">&copy; <span id="year"></span> FearLess Diving.</p>
    </footer>

    <a href="tel:+919876543210" class="float-icon phone-float"><i class="fas fa-phone-alt"></i></a>
    <a href="https://wa.me/919876543210" target="_blank" class="float-icon wa-float"><i class="fab fa-whatsapp"></i></a>

    <script src="script.js"></script>
</body>
</html>
