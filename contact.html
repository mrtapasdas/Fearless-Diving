<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | FearLess Diving</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ocean: '#0f172a', cyan: '#06b6d4' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-ocean text-white antialiased no-select">

    <nav class="fixed w-full z-50 bg-slate-900/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fas fa-water text-cyan-400 text-3xl"></i>
                <a href="index.html" class="font-bold text-2xl tracking-wider">FEAR<span class="text-cyan-400">LESS</span></a>
            </div>
            <div class="hidden md:flex space-x-8">
                <a href="index.html" class="hover:text-cyan-400">Home</a>
                <a href="about.html" class="hover:text-cyan-400">About</a>
                <a href="services.html" class="hover:text-cyan-400">Services</a>
                <a href="contact.html" class="text-cyan-400">Contact</a>
            </div>
            <div class="md:hidden">
                <button id="menu-btn"><i class="fas fa-bars text-xl"></i></button>
            </div>
        </div>
        <div class="hidden bg-slate-800" id="mobile-menu">
            <a href="index.html" class="block px-4 py-3 border-b border-slate-700">Home</a>
            <a href="about.html" class="block px-4 py-3 border-b border-slate-700">About</a>
            <a href="services.html" class="block px-4 py-3">Services</a>
        </div>
    </nav>

    <div class="pt-32 pb-10 text-center bg-slate-900">
        <h1 class="text-4xl font-bold">Get In Touch</h1>
        <p class="text-slate-400 mt-2">We'd love to hear from you.</p>
    </div>

    <section class="py-12 max-w-7xl mx-auto px-4">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <!-- Form -->
            <div class="bg-slate-800 p-8 rounded-xl shadow-lg border border-slate-700">
                <h3 class="text-2xl font-bold mb-6">Send a Message</h3>
                <form action="#" onsubmit="alert('Thank you! We will contact you soon.'); return false;">
                    <div class="mb-4">
                        <label class="block text-slate-300 mb-2">Name</label>
                        <input type="text" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-cyan-400 focus:outline-none" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-slate-300 mb-2">Phone / WhatsApp</label>
                        <input type="tel" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-cyan-400 focus:outline-none" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-slate-300 mb-2">Service Interested In</label>
                        <select class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-cyan-400 focus:outline-none">
                            <option>Scuba Diving</option>
                            <option>Snorkeling</option>
                            <option>Boat Trip</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label class="block text-slate-300 mb-2">Message</label>
                        <textarea rows="4" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-cyan-400 focus:outline-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 to-teal-600 text-white font-bold py-3 rounded-lg hover:from-cyan-700 hover:to-teal-700 transition">Submit</button>
                </form>
            </div>

            <!-- Contact Info & Map -->
            <div class="space-y-8">
                <!-- Info Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-slate-800 p-6 rounded-lg text-center border border-slate-700">
                        <i class="fas fa-phone-alt text-3xl text-cyan-400 mb-4"></i>
                        <h4 class="font-bold">Call Us</h4>
                        <p class="text-slate-400 text-sm mt-2">+1 234 567 890</p>
                    </div>
                    <div class="bg-slate-800 p-6 rounded-lg text-center border border-slate-700">
                        <i class="fas fa-envelope text-3xl text-cyan-400 mb-4"></i>
                        <h4 class="font-bold">Email Us</h4>
                        <p class="text-slate-400 text-sm mt-2">info@fearlessdiving.com</p>
                    </div>
                </div>

                <!-- Map -->
                <div class="bg-slate-800 p-2 rounded-xl shadow-lg border border-slate-700 h-80 overflow-hidden relative">
                     <!-- Using an iframe for map (No API key needed for basic embed) -->
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3876.541306352932!2d-72.24647348536647!3d18.536750074210086!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8eb9e8436402371d%3A0xb3623651167e4118!2sScuba%20Diving!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus" 
                        width="100%" 
                        height="100%" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-slate-900 py-8 border-t border-slate-800 text-center text-slate-500 text-xs">
        &copy; 2024 FearLess Diving.
    </footer>

    <!-- Floating Icons -->
    <a href="tel:+1234567890" class="fixed left-4 bottom-4 bg-blue-600 text-white p-4 rounded-full shadow-lg z-50"><i class="fas fa-phone-alt text-xl"></i></a>
    <a href="https://wa.me/1234567890" target="_blank" class="fixed right-4 bottom-4 bg-green-500 text-white p-4 rounded-full shadow-lg z-50"><i class="fab fa-whatsapp text-2xl"></i></a>

    <script src="script.js"></script>
</body>
</html>
