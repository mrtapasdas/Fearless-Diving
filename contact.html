<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | FearLess Diving</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-50 antialiased">

    <!-- Nav (Duplicate) -->
    <nav class="bg-slate-800/90 backdrop-blur-md fixed w-full z-50 border-b border-cyan-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center">
                        <i class="fa-solid fa-water text-cyan-400 text-3xl mr-2"></i>
                        <span class="font-bold text-xl tracking-wider">FearLess<span class="text-cyan-400">Diving</span></span>
                    </a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="index.html" class="hover:text-cyan-400 px-3 py-2 rounded-md transition">Home</a>
                        <a href="about.html" class="hover:text-cyan-400 px-3 py-2 rounded-md transition">About Us</a>
                        <a href="services.html" class="hover:text-cyan-400 px-3 py-2 rounded-md transition">Services</a>
                        <a href="contact.html" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-md transition">Contact Us</a>
                    </div>
                </div>
                <div class="-mr-2 flex md:hidden">
                    <button onclick="toggleMenu()" class="text-gray-300 hover:text-white p-2">
                        <i class="fa-solid fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="hidden md:hidden bg-slate-800" id="mobile-nav">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="index.html" class="text-gray-300 block px-3 py-2 rounded-md">Home</a>
                <a href="about.html" class="text-gray-300 block px-3 py-2 rounded-md">About Us</a>
                <a href="services.html" class="text-gray-300 block px-3 py-2 rounded-md">Services</a>
                <a href="contact.html" class="text-cyan-400 font-bold block px-3 py-2 rounded-md">Contact Us</a>
            </div>
        </div>
    </nav>

    <div class="pt-32 pb-12 text-center">
        <h1 class="text-4xl font-bold text-cyan-400">Get In Touch</h1>
        <p class="text-gray-400 mt-2">Ready for the dive? Contact us now.</p>
    </div>

    <div class="max-w-7xl mx-auto px-4 pb-20 grid grid-cols-1 md:grid-cols-2 gap-12">
        
        <!-- Contact Form -->
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl">
            <form onsubmit="event.preventDefault(); alert('Message sent! We will contact you via WhatsApp.');">
                <div class="mb-4">
                    <label class="block text-gray-400 text-sm font-bold mb-2">Name</label>
                    <input type="text" class="w-full bg-slate-900 border border-slate-700 rounded py-3 px-3 text-white focus:outline-none focus:border-cyan-500" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-400 text-sm font-bold mb-2">Phone / WhatsApp</label>
                    <input type="tel" class="w-full bg-slate-900 border border-slate-700 rounded py-3 px-3 text-white focus:outline-none focus:border-cyan-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-400 text-sm font-bold mb-2">Message</label>
                    <textarea class="w-full bg-slate-900 border border-slate-700 rounded py-3 px-3 text-white focus:outline-none focus:border-cyan-500 h-32"></textarea>
                </div>
                <button class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded transition">
                    Send Message
                </button>
            </form>
            
            <div class="mt-8 space-y-4">
                <div class="flex items-center text-gray-300">
                    <i class="fa-solid fa-phone w-8 text-cyan-400"></i> +91 98765 43210
                </div>
                <div class="flex items-center text-gray-300">
                    <i class="fa-solid fa-envelope w-8 text-cyan-400"></i> booking@fearlessdiving.com
                </div>
            </div>
        </div>

        <!-- Google Map -->
        <div class="bg-slate-800 p-2 rounded-2xl border border-slate-700 shadow-xl h-96 md:h-auto">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31535.15814040776!2d92.7176!3d11.6647!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3088946b5a34e569%3A0xf670860959828230!2sHavelock%20Island!5e0!3m2!1sen!2sin!4v1600000000000!5m2!1sen!2sin" 
                width="100%" height="100%" style="border:0; border-radius: 10px;" allowfullscreen="" loading="lazy">
            </iframe>
        </div>

    </div>

    <!-- Fixed Buttons & Script -->
    <div class="fixed bottom-4 right-4 flex flex-col space-y-3 z-50">
        <a href="tel:+919876543210" class="bg-blue-600 w-12 h-12 rounded-full flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-phone"></i></a>
        <a href="https://wa.me/919876543210" target="_blank" class="bg-green-500 w-12 h-12 rounded-full flex items-center justify-center text-white shadow-lg"><i class="fa-brands fa-whatsapp text-2xl"></i></a>
    </div>
    <script src="script.js"></script>
</body>
</html>
