<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | FearLess Diving</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { deep: '#0f172a', primary: '#0ea5e9', secondary: '#64748b' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-deep text-slate-200 no-select">
    
    <!-- Header -->
    <header class="bg-deep/90 backdrop-blur-md fixed w-full top-0 z-50 border-b border-gray-800">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-primary flex items-center gap-2"><i class="fa-solid fa-water"></i> FearLess<span class="text-white">Diving</span></a>
            <div class="hidden md:flex items-center space-x-8">
                <a href="index.html" class="text-gray-300 hover:text-primary transition">Home</a>
                <a href="about.html" class="text-gray-300 hover:text-primary transition">About Us</a>
                <a href="services.html" class="text-gray-300 hover:text-primary transition">Services</a>
                <a href="contact.html" class="text-primary hover:text-primary transition">Contact Us</a>
            </div>
            <button id="menu-btn" class="md:hidden text-white focus:outline-none"><i class="fa-solid fa-bars text-2xl"></i></button>
        </nav>
        <div id="mobile-menu" class="bg-deep border-b border-gray-800 md:hidden flex flex-col items-center">
            <a href="index.html" class="block py-3 text-gray-300 hover:text-primary">Home</a>
            <a href="about.html" class="block py-3 text-gray-300 hover:text-primary">About Us</a>
            <a href="services.html" class="block py-3 text-gray-300 hover:text-primary">Services</a>
            <a href="contact.html" class="block py-3 text-white hover:text-primary">Contact Us</a>
        </div>
    </header>

    <section class="pt-32 pb-20 container mx-auto px-6">
        <h1 class="text-4xl font-bold text-center mb-16">Get in <span class="text-primary">Touch</span></h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <!-- Form -->
            <div class="bg-slate-800 p-8 rounded-xl border border-slate-700">
                <h3 class="text-2xl font-bold mb-6">Send us a Message</h3>
                <form action="#" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Name</label>
                        <input type="text" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Phone</label>
                        <input type="tel" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Message</label>
                        <textarea class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-primary h-32"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-primary hover:bg-sky-600 text-white font-bold py-3 rounded transition">Send Message</button>
                </form>
            </div>

            <!-- Contact Info & Map -->
            <div class="space-y-8">
                <div>
                    <h3 class="text-2xl font-bold mb-4">Contact Details</h3>
                    <p class="text-gray-400 mb-2"><i class="fa-solid fa-phone text-primary mr-2"></i> +91 999 999 9999</p>
                    <p class="text-gray-400 mb-2"><i class="fa-brands fa-whatsapp text-primary mr-2"></i> +91 999 999 9999</p>
                    <p class="text-gray-400 mb-2"><i class="fa-solid fa-envelope text-primary mr-2"></i> info@fearlessdiving.com</p>
                    <p class="text-gray-400"><i class="fa-solid fa-location-dot text-primary mr-2"></i> Calangute Beach Road, Goa, India</p>
                </div>

                <div class="rounded-xl overflow-hidden border border-slate-700 h-64">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3844.2764832488355!2d73.76104861485265!3d15.524254089218274!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bbfc1bf6d313c01%3A0x6b772c67b93510!2sCalangute%20Beach!5e0!3m2!1sen!2sin!4v1619524992238!5m2!1sen!2sin" 
                        width="100%" 
                        height="100%" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-slate-950 pt-8 pb-8 border-t border-slate-800">
        <div class="container mx-auto px-6 text-center text-gray-500 text-sm">
            &copy; <span id="year"></span> FearLess Diving. All rights reserved.
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
