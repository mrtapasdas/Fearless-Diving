<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | FearLess Diving</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ocean: '#0f172a', deep: '#020617', cyan: '#06b6d4', teal: '#14b8a6' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-ocean text-white antialiased select-none">

    <!-- Header -->
    <header class="fixed w-full top-0 z-50 bg-ocean/90 backdrop-blur-md border-b border-gray-800 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <i class="fa-solid fa-water text-cyan text-3xl"></i>
                <span class="text-2xl font-bold tracking-wider">FEAR<span class="text-cyan">LESS</span></span>
            </a>
            <nav class="hidden md:flex gap-8 font-medium">
                <a href="index.html" class="hover:text-cyan transition">Home</a>
                <a href="about.html" class="hover:text-cyan transition">About Us</a>
                <a href="services.html" class="hover:text-cyan transition">Services</a>
                <a href="contact.html" class="text-cyan transition">Contact Us</a>
            </nav>
            <button id="menu-btn" class="md:hidden text-2xl focus:outline-none"><i class="fa-solid fa-bars"></i></button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-deep border-t border-gray-800">
            <a href="index.html" class="block py-3 px-4 hover:bg-gray-800">Home</a>
            <a href="about.html" class="block py-3 px-4 hover:bg-gray-800">About Us</a>
            <a href="services.html" class="block py-3 px-4 hover:bg-gray-800">Services</a>
            <a href="contact.html" class="block py-3 px-4 hover:bg-gray-800">Contact Us</a>
        </div>
    </header>

    <div class="pt-28 pb-16 container mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            
            <!-- Contact Info -->
            <div>
                <h1 class="text-4xl font-bold mb-6 text-cyan">Get In Touch</h1>
                <p class="text-gray-300 mb-8">Ready to dive? Have questions? Reach out to us directly or fill the form.</p>
                
                <div class="space-y-6">
                    <div class="flex items-center gap-4 bg-gray-800 p-4 rounded-lg">
                        <div class="bg-cyan/20 p-3 rounded-full text-cyan"><i class="fa-solid fa-phone text-xl"></i></div>
                        <div>
                            <h3 class="font-bold">Phone</h3>
                            <p class="text-gray-400">+91 99999 99999</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 bg-gray-800 p-4 rounded-lg">
                        <div class="bg-cyan/20 p-3 rounded-full text-cyan"><i class="fa-brands fa-whatsapp text-xl"></i></div>
                        <div>
                            <h3 class="font-bold">WhatsApp</h3>
                            <p class="text-gray-400">+91 99999 99999</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 bg-gray-800 p-4 rounded-lg">
                        <div class="bg-cyan/20 p-3 rounded-full text-cyan"><i class="fa-solid fa-envelope text-xl"></i></div>
                        <div>
                            <h3 class="font-bold">Email</h3>
                            <p class="text-gray-400">bookings@fearlessdiving.com</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form -->
            <div class="bg-gray-900 p-8 rounded-xl shadow-lg border border-gray-800">
                <form action="#" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">Your Name</label>
                        <input type="text" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-cyan" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Phone Number</label>
                        <input type="tel" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-cyan" placeholder="+91 0000000000">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Message</label>
                        <textarea class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-cyan h-32" placeholder="I want to book..."></textarea>
                    </div>
                    <button class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 text-deep font-bold py-3 rounded hover:opacity-90 transition">Send Message</button>
                </form>
            </div>
        </div>

        <!-- Map -->
        <div class="mt-16">
            <h2 class="text-2xl font-bold mb-6">Find Us Here</h2>
            <div class="w-full h-80 rounded-xl overflow-hidden border border-gray-700">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3844.6!2d73.4!3d16.0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTbCsDAwJzAwLjAiTiA3M8KwMjQnMDAuMCJF!5e0!3m2!1sen!2sin!4v1600000000000!5m2!1sen!2sin" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
