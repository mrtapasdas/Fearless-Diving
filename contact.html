<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | FearLess Diving</title>
    <meta name="description" content="Get in touch with FearLess Diving for bookings, inquiries, and location details.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-white antialiased flex flex-col min-h-screen">

    <!-- Header (Same as Index) -->
    <header class="fixed w-full z-50 bg-slate-900/95 backdrop-blur shadow-lg border-b border-slate-800">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-cyan-400 uppercase tracking-widest">
                <i class="fa-solid fa-water"></i> FearLess
            </a>
            <div class="hidden md:flex space-x-8">
                <a href="index.html" class="hover:text-cyan-400 transition">Home</a>
                <a href="about.html" class="hover:text-cyan-400 transition">About Us</a>
                <a href="services.html" class="hover:text-cyan-400 transition">Services</a>
                <a href="contact.html" class="text-cyan-400 transition">Contact Us</a>
            </div>
            <button id="menu-btn" class="md:hidden text-cyan-400 focus:outline-none">
                <i class="fa-solid fa-bars fa-2x"></i>
            </button>
        </nav>
        <div id="menu" class="hidden absolute top-full left-0 w-full bg-slate-900 flex-col items-center py-8 space-y-6 shadow-xl border-b border-slate-700">
            <a href="index.html" class="hover:text-cyan-400">Home</a>
            <a href="about.html" class="hover:text-cyan-400">About Us</a>
            <a href="services.html" class="hover:text-cyan-400">Services</a>
            <a href="contact.html" class="hover:text-cyan-400">Contact Us</a>
        </div>
    </header>

    <main class="flex-grow pt-32 pb-20">
        <div class="container mx-auto px-6">
            <h1 class="text-4xl font-bold text-center mb-12">Get In <span class="text-cyan-400">Touch</span></h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <!-- Contact Form -->
                <div class="bg-slate-800 p-8 rounded-2xl shadow-xl">
                    <h3 class="text-2xl font-bold mb-6">Send a Message</h3>
                    <form action="#" class="space-y-6">
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Name</label>
                            <input type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-400" placeholder="Your Name">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Email</label>
                            <input type="email" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-400" placeholder="Your Email">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Message</label>
                            <textarea rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-400" placeholder="How can we help?"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-lg font-bold transition">Send Message</button>
                    </form>
                </div>

                <!-- Info & Map -->
                <div class="space-y-8">
                    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl">
                        <h3 class="text-2xl font-bold mb-6">Contact Details</h3>
                        <ul class="space-y-4">
                            <li class="flex items-start gap-4">
                                <i class="fa-solid fa-location-dot text-cyan-400 mt-1"></i>
                                <span>Beach Road, Near Grand Island Ferry Point,<br>Goa, India - 403001</span>
                            </li>
                            <li class="flex items-center gap-4">
                                <i class="fa-solid fa-phone text-cyan-400"></i>
                                <span>+91 98765 43210</span>
                            </li>
                            <li class="flex items-center gap-4">
                                <i class="fa-solid fa-envelope text-cyan-400"></i>
                                <span>info@fearlessdiving.com</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Embed Map -->
                    <div class="w-full h-64 bg-slate-800 rounded-2xl overflow-hidden shadow-xl">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3844.629339399224!2d73.805!3d15.505!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTXCsDMwJzE4LjAiTiA3M8KwNDgnMTguMCJF!5e0!3m2!1sen!2sin!4v1620000000000!5m2!1sen!2sin" 
                            width="100%" 
                            height="100%" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer (Same as Index) -->
    <footer class="bg-slate-950 pt-16 pb-8 border-t border-slate-800 mt-auto">
        <div class="container mx-auto px-6 text-center">
            <p class="text-gray-500 text-xs">&copy; <span id="year"></span> FearLess Diving. All rights reserved.</p>
        </div>
    </footer>
    
    <!-- Floating Icons -->
    <a href="tel:+919876543210" class="fixed bottom-6 left-6 bg-blue-600 w-12 h-12 rounded-full flex items-center justify-center text-white shadow-lg z-50 hover:scale-110 transition animate-bounce">
        <i class="fa-solid fa-phone"></i>
    </a>
    <a href="https://wa.me/919876543210" target="_blank" class="fixed bottom-6 right-6 bg-green-500 w-12 h-12 rounded-full flex items-center justify-center text-white shadow-lg z-50 hover:scale-110 transition animate-bounce">
        <i class="fa-brands fa-whatsapp text-2xl"></i>
    </a>

    <script src="script.js"></script>
</body>
</html>
