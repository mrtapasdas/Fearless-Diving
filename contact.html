<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | FearLess Diving</title>
    <meta name="robots" content="index, follow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="no-select bg-slate-900 text-white flex flex-col min-h-screen">

    <!-- Header -->
    <header class="fixed w-full z-50 top-0 bg-glass border-b border-slate-700">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-sky-400 tracking-wider">
                <i class="fa-solid fa-water"></i> FearLess<span class="text-white">Diving</span>
            </a>
            <div class="hidden md:flex space-x-8 items-center">
                <a href="index.html" class="hover:text-sky-400 transition">Home</a>
                <a href="about.html" class="hover:text-sky-400 transition">About Us</a>
                <a href="services.html" class="hover:text-sky-400 transition">Services</a>
                <a href="contact.html" class="px-5 py-2 bg-sky-500 hover:bg-sky-600 rounded-full transition font-semibold">Contact Us</a>
            </div>
            <button id="menu-btn" class="block md:hidden focus:outline-none">
                <i class="fa-solid fa-bars text-2xl"></i>
            </button>
        </nav>
        <div id="menu" class="hidden flex-col items-center bg-slate-800 md:hidden py-4 space-y-4 border-t border-slate-700">
            <a href="index.html" class="hover:text-sky-400">Home</a>
            <a href="about.html" class="hover:text-sky-400">About Us</a>
            <a href="services.html" class="hover:text-sky-400">Services</a>
            <a href="contact.html" class="text-sky-400">Contact Us</a>
        </div>
    </header>

    <main class="flex-grow pt-24 pb-20 container mx-auto px-6">
        <h1 class="text-4xl font-bold text-center mb-12">Get In Touch</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            
            <!-- Contact Info & Form -->
            <div>
                <div class="mb-10">
                    <h3 class="text-xl font-bold mb-4 text-sky-400">Contact Details</h3>
                    <p class="mb-2"><i class="fa-solid fa-phone mr-3 text-sky-500"></i> +91 98765 43210</p>
                    <p class="mb-2"><i class="fa-solid fa-envelope mr-3 text-sky-500"></i> booking@fearlessdiving.com</p>
                    <p class="mb-2"><i class="fa-solid fa-location-dot mr-3 text-sky-500"></i> Malvan Beach, Sindhudurg, Maharashtra</p>
                </div>

                <form action="#" class="space-y-4">
                    <input type="text" placeholder="Your Name" class="w-full p-3 bg-slate-800 rounded border border-slate-700 focus:outline-none focus:border-sky-500 text-white">
                    <input type="email" placeholder="Your Email" class="w-full p-3 bg-slate-800 rounded border border-slate-700 focus:outline-none focus:border-sky-500 text-white">
                    <input type="text" placeholder="Phone Number" class="w-full p-3 bg-slate-800 rounded border border-slate-700 focus:outline-none focus:border-sky-500 text-white">
                    <textarea rows="4" placeholder="Message" class="w-full p-3 bg-slate-800 rounded border border-slate-700 focus:outline-none focus:border-sky-500 text-white"></textarea>
                    <button type="button" class="px-8 py-3 bg-sky-600 hover:bg-sky-700 rounded font-bold transition w-full">Send Message</button>
                </form>
            </div>

            <!-- Map -->
            <div class="h-[400px] lg:h-auto rounded-xl overflow-hidden shadow-lg border-2 border-slate-700">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3839.887228795744!2d73.4651233148545!3d16.05267898889144!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b9e4a3c12345678%3A0x123456789abcdef!2sMalvan%20Beach!5e0!3m2!1sen!2sin!4v1620000000000!5m2!1sen!2sin" 
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black pt-10 pb-20 border-t border-slate-800 mt-auto">
        <div class="container mx-auto px-6 text-center">
             <p class="text-slate-400 text-sm">&copy; <span id="year"></span> FearLess Diving.</p>
        </div>
    </footer>
    
    <a href="tel:+919876543210" class="fixed bottom-4 left-4 z-50 bg-blue-600 w-12 h-12 rounded-full flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-phone"></i></a>
    <a href="https://wa.me/919876543210" class="fixed bottom-4 right-4 z-50 bg-green-500 w-12 h-12 rounded-full flex items-center justify-center text-white shadow-lg"><i class="fa-brands fa-whatsapp text-xl"></i></a>

    <script src="script.js"></script>
</body>
</html>
