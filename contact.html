<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | FearLess Diving</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { deep: '#020b16', ocean: '#0f172a', cyan: '#06b6d4', } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-deep text-gray-200 antialiased">
    
    <header class="fixed w-full top-0 z-50 bg-deep/90 backdrop-blur-md border-b border-white/10">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-cyan tracking-wider"><i class="fa-solid fa-water"></i> FearLess</a>
            <nav class="hidden md:flex space-x-8">
                <a href="about.html" class="hover:text-cyan transition">About Us</a>
                <a href="services.html" class="hover:text-cyan transition">Services</a>
                <a href="contact.html" class="text-cyan transition">Contact Us</a>
            </nav>
            <button id="menu-btn" class="block md:hidden text-white"><i class="fa-solid fa-bars text-2xl"></i></button>
        </div>
        <div id="menu" class="hidden flex-col md:hidden bg-ocean absolute w-full text-center py-4 border-b border-white/10">
            <a href="about.html" class="block py-2">About Us</a>
            <a href="services.html" class="block py-2">Services</a>
            <a href="contact.html" class="block py-2">Contact Us</a>
        </div>
    </header>

    <section class="pt-24 pb-12 container mx-auto px-6 h-screen flex flex-col justify-center">
        <h1 class="text-4xl font-bold text-white text-center mb-10">Get In Touch</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 h-full md:h-3/4 bg-ocean rounded-xl overflow-hidden shadow-2xl border border-white/10">
            
            <!-- Left: Form -->
            <div class="p-8 flex flex-col justify-center">
                <form action="#" onsubmit="event.preventDefault(); alert('Thank you! We will contact you shortly via WhatsApp.');" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Name</label>
                        <input type="text" class="w-full bg-deep border border-white/10 rounded p-2 text-white focus:outline-none focus:border-cyan" placeholder="Your Name">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Phone</label>
                        <input type="tel" class="w-full bg-deep border border-white/10 rounded p-2 text-white focus:outline-none focus:border-cyan" placeholder="+91">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Message</label>
                        <textarea class="w-full bg-deep border border-white/10 rounded p-2 text-white focus:outline-none focus:border-cyan h-24" placeholder="I want to dive..."></textarea>
                    </div>
                    <button class="w-full bg-cyan text-deep font-bold py-3 rounded hover:bg-white transition">Send Message</button>
                </form>
                
                <div class="mt-8 space-y-2 text-sm text-gray-400">
                    <p><i class="fa-solid fa-envelope w-6 text-cyan"></i> info@fearlessdiving.com</p>
                    <p><i class="fa-solid fa-phone w-6 text-cyan"></i> +91 98765 43210</p>
                </div>
            </div>

            <!-- Right: Map -->
            <div class="relative w-full h-full min-h-[300px] map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d60998.40673479008!2d73.43603896593452!3d16.053896068218155!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bbfed9207869327%3A0x46422896a24719d3!2sMalvan%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </section>

    <script src="assets/js/script.js"></script>
</body>
</html>
