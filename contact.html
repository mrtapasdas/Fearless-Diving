<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | FearLess Diving</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 no-select">

    <!-- Header -->
    <header class="fixed w-full top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-700">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-cyan-400"><i class="fa-solid fa-water"></i> FearLess<span class="text-white">Diving</span></a>
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="hover:text-cyan-400 transition">Home</a>
                <a href="about.html" class="hover:text-cyan-400 transition">About Us</a>
                <a href="services.html" class="hover:text-cyan-400 transition">Services</a>
                <a href="contact.html" class="text-cyan-400 transition">Contact Us</a>
            </nav>
            <button id="menu-btn" class="md:hidden text-2xl focus:outline-none"><i class="fa-solid fa-bars"></i></button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-slate-800 p-4 space-y-4 border-t border-slate-700">
            <a href="index.html" class="block hover:text-cyan-400">Home</a>
            <a href="about.html" class="block hover:text-cyan-400">About Us</a>
            <a href="services.html" class="block hover:text-cyan-400">Services</a>
            <a href="contact.html" class="block hover:text-cyan-400">Contact Us</a>
        </div>
    </header>

    <div class="pt-24 pb-12 bg-slate-800">
        <h1 class="text-4xl font-bold text-center">Contact <span class="text-cyan-400">Us</span></h1>
    </div>

    <section class="py-12 container mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            
            <!-- Contact Details -->
            <div>
                <h2 class="text-2xl font-bold mb-6">Get in Touch</h2>
                <div class="space-y-6">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-cyan-500/20 rounded-full flex items-center justify-center text-cyan-400 text-xl mr-4"><i class="fa-solid fa-location-dot"></i></div>
                        <div>
                            <h4 class="font-bold">Address</h4>
                            <p class="text-slate-400">123, Ocean View Road, Grand Island, Goa, India</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-cyan-500/20 rounded-full flex items-center justify-center text-cyan-400 text-xl mr-4"><i class="fa-solid fa-phone"></i></div>
                        <div>
                            <h4 class="font-bold">Phone</h4>
                            <p class="text-slate-400">+91 98765 43210</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-cyan-500/20 rounded-full flex items-center justify-center text-cyan-400 text-xl mr-4"><i class="fa-solid fa-envelope"></i></div>
                        <div>
                            <h4 class="font-bold">Email</h4>
                            <p class="text-slate-400">info@fearlessdiving.com</p>
                        </div>
                    </div>
                </div>

                <!-- Map -->
                <div class="mt-8 rounded-xl overflow-hidden shadow-lg border border-slate-700 h-64">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3847.4116893693245!2d73.8016!3d15.3524!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bbfb61863584869%3A0x444f6534567!2sGoa!5e0!3m2!1sen!2sin!4v1600000000000!5m2!1sen!2sin" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>

            <!-- Form -->
            <div class="glass-card p-8 rounded-xl">
                <h2 class="text-2xl font-bold mb-6">Send Message</h2>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">Your Name</label>
                        <input type="text" class="w-full bg-slate-800 border border-slate-600 rounded p-3 text-white focus:outline-none focus:border-cyan-400">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">Phone Number</label>
                        <input type="tel" class="w-full bg-slate-800 border border-slate-600 rounded p-3 text-white focus:outline-none focus:border-cyan-400">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-slate-300">Message</label>
                        <textarea rows="4" class="w-full bg-slate-800 border border-slate-600 rounded p-3 text-white focus:outline-none focus:border-cyan-400"></textarea>
                    </div>
                    <button type="button" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 rounded transition">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 py-12 border-t border-slate-800 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 FearLess Diving.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
