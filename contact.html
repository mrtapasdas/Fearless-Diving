<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us | FearLess Diving</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-200 no-select">

    <header class="fixed w-full z-50 bg-slate-900/90 backdrop-blur-md shadow-lg border-b border-slate-700">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-cyan-400 tracking-wider"><i class="fas fa-water mr-2"></i>FEARLESS</a>
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="hover:text-cyan-400 transition">Home</a>
                <a href="about.html" class="hover:text-cyan-400 transition">About Us</a>
                <a href="services.html" class="hover:text-cyan-400 transition">Services</a>
                <a href="contact.html" class="text-cyan-400 font-bold transition">Contact Us</a>
            </nav>
            <button id="menu-btn" class="block md:hidden"><i class="fas fa-bars text-2xl text-cyan-400"></i></button>
        </div>
        <div id="menu" class="hidden absolute top-full left-0 w-full bg-slate-800 flex-col items-center py-4 space-y-4 shadow-xl md:hidden">
            <a href="index.html" class="hover:text-cyan-400">Home</a>
            <a href="about.html" class="hover:text-cyan-400">About Us</a>
            <a href="services.html" class="hover:text-cyan-400">Services</a>
            <a href="contact.html" class="text-cyan-400">Contact Us</a>
        </div>
    </header>

    <main class="pt-32 pb-20">
        <div class="container mx-auto px-6">
            <h1 class="text-4xl font-bold text-center mb-12">Get In <span class="text-cyan-400">Touch</span></h1>

            <div class="flex flex-col lg:flex-row gap-12">
                <!-- Contact Info & Form -->
                <div class="lg:w-1/2 space-y-8">
                    <div class="bg-slate-800 p-6 rounded-lg shadow-lg">
                        <h3 class="text-2xl font-bold mb-6 text-white">Contact Details</h3>
                        <div class="space-y-4">
                            <p class="flex items-center"><i class="fas fa-map-marker-alt w-8 text-cyan-400 text-xl"></i> Calangute Beach Road, Goa, 403516</p>
                            <p class="flex items-center"><i class="fas fa-phone w-8 text-cyan-400 text-xl"></i> +91 98765 43210</p>
                            <p class="flex items-center"><i class="fas fa-envelope w-8 text-cyan-400 text-xl"></i> info@fearlessdiving.com</p>
                            <p class="flex items-center"><i class="fab fa-whatsapp w-8 text-cyan-400 text-xl"></i> +91 98765 43210</p>
                        </div>
                    </div>

                    <form onsubmit="event.preventDefault(); alert('Thank you! We will contact you shortly.');" class="bg-slate-800 p-6 rounded-lg shadow-lg">
                        <h3 class="text-2xl font-bold mb-4 text-white">Send Message</h3>
                        <input type="text" placeholder="Your Name" class="w-full bg-slate-900 border border-slate-700 text-white rounded p-3 mb-4 focus:border-cyan-500 focus:outline-none" required>
                        <input type="tel" placeholder="Phone Number" class="w-full bg-slate-900 border border-slate-700 text-white rounded p-3 mb-4 focus:border-cyan-500 focus:outline-none" required>
                        <textarea rows="4" placeholder="Your Message" class="w-full bg-slate-900 border border-slate-700 text-white rounded p-3 mb-4 focus:border-cyan-500 focus:outline-none"></textarea>
                        <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 rounded transition">Send Message</button>
                    </form>
                </div>

                <!-- Map -->
                <div class="lg:w-1/2 h-96 lg:h-auto rounded-lg overflow-hidden border-2 border-slate-700 shadow-xl">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3844.606778401344!2d73.7533!3d15.5494!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bbfc1f8e5f2b6e5%3A0x8e8a6d6d8f8a6d6d!2sCalangute%20Beach!5e0!3m2!1sen!2sin!4v1620000000000!5m2!1sen!2sin" 
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Icons & Footer (Same as Index) -->
    <a href="tel:+919876543210" class="fixed bottom-4 left-4 z-50 bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:bg-blue-700 hover:scale-110 transition"><i class="fas fa-phone-alt text-xl"></i></a>
    <div onclick="bookNow('Contact Inquiry')" class="fixed bottom-4 right-4 z-50 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:bg-green-600 hover:scale-110 transition cursor-pointer"><i class="fab fa-whatsapp text-3xl"></i></div>

    <script src="script.js"></script>
</body>
</html>
